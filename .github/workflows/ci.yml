# Lint, test and build on every push and pull request.
# Needs the repository secret BRYNTUM_NPM_TOKEN (the token from ~/.npmrc after the Bryntum trial npm login) to install @bryntum.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same as render.yaml: the token line is added at build time so the repo's .npmrc never overrides a local npm login.
      - run: echo "//npm.bryntum.com/:_authToken=${BRYNTUM_NPM_TOKEN}" >> .npmrc
        env:
          BRYNTUM_NPM_TOKEN: ${{ secrets.BRYNTUM_NPM_TOKEN }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
